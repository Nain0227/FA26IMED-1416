<!DOCTYPE html>
<html lang="en-US">
<head>
 <title>Overlapping Elements</title>
<style>
  img {position:absolute; left:0px; top:0px; z-index: -1;}
</style>
</head>

<body>
<header>
  <nav> <!-- Navigation Section  -->
    <ul>
      <li><a href="../index.html">Chapter 03 Homepage</a></li>
    </ul>
  </nav>
</header>

<section> <!-- Main body portion of site -->
  <h1>ABC Global Consulting</h1>
  <img src="logo.png" width="80" height="80">
  <p>The image has a z-index of -1 therefore it is placed behind the text.</p>
</section>

<footer>
 <nav> <!-- This is the site map -->
  <ul>
    <li><a href="../index.html">Chapter 03 Homepage</a></li>
  </ul>
 </nav>
</footer>
</body>

</html>
